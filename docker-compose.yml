services:
  tempmail:
    build: .
    container_name: tempmail
    restart: unless-stopped
    # 进程在 SIGTERM 后最多 15 秒完成优雅退出，宽限期需长于该上限。
    stop_grace_period: 20s
    # init 负责转发信号并回收意外子进程。
    init: true
    env_file:
      - .env
    ports:
      # 生产环境可设置 WEB_BIND_HOST=127.0.0.1，避免绕过 HTTPS 反向代理直接访问管理页面。
      - "${WEB_BIND_HOST:-0.0.0.0}:8081:5000"
      - "25:25"       # SMTP 需保持公网收信能力
    volumes:
      - ./data:/app/data
