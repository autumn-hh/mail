<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="referrer" content="no-referrer">
    <title>访问邮箱 · Maildrop</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232F746D'/%3E%3Cpath d='M7 10h18v12H7zM8 11l8 6 8-6' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/mailbox_login.css') }}">
</head>
<body>
    <!-- 内联线性图标避免第三方字体与外部资源泄露访问凭据。 -->
    <svg class="icon-sprite" aria-hidden="true">
        <symbol id="icon-mail" viewBox="0 0 24 24">
            <path d="M3 6.75h18v10.5H3zM4 7.5l8 6 8-6"></path>
        </symbol>
        <symbol id="icon-key" viewBox="0 0 24 24">
            <circle cx="8" cy="12" r="4"></circle><path d="M12 12h9m-3 0v3m-3-3v2"></path>
        </symbol>
        <symbol id="icon-eye" viewBox="0 0 24 24">
            <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"></path><circle cx="12" cy="12" r="2.5"></circle>
        </symbol>
        <symbol id="icon-eye-off" viewBox="0 0 24 24">
            <path d="M3 3l18 18M10.6 6.1A9 9 0 0 1 12 6c6 0 9.5 6 9.5 6a16 16 0 0 1-3 3.7M6.2 6.2C3.8 8 2.5 12 2.5 12s3.5 6 9.5 6c1.3 0 2.5-.3 3.5-.8M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
        </symbol>
        <symbol id="icon-arrow" viewBox="0 0 24 24">
            <path d="M5 12h14m-5-5 5 5-5 5"></path>
        </symbol>
        <symbol id="icon-shield" viewBox="0 0 24 24">
            <path d="M12 3l7 3v5c0 4.6-2.8 8.1-7 10-4.2-1.9-7-5.4-7-10V6z"></path><path d="M9 12l2 2 4-4"></path>
        </symbol>
        <symbol id="icon-theme" viewBox="0 0 24 24">
            <path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"></path>
        </symbol>
    </svg>

    <main class="login-shell">
        <section class="intro-panel" aria-labelledby="page-title">
            <div class="brand-mark" aria-hidden="true">
                <svg class="icon"><use href="#icon-mail"></use></svg>
            </div>
            <p class="eyebrow">MAILBOX ACCESS</p>
            <h1 id="page-title">安静地，查看你的临时邮箱</h1>
            <p class="intro-copy">输入邮箱地址和创建时生成的密钥，即可进入只收信的邮箱空间。</p>
            <div class="privacy-note">
                <svg class="icon"><use href="#icon-shield"></use></svg>
                <div>
                    <strong>凭据不会写入本地存储</strong>
                    <span>访问地址本身包含邮箱与密钥，请勿在公共设备上保存或分享。</span>
                </div>
            </div>
        </section>

        <section class="login-card" aria-labelledby="login-title">
            <div class="card-heading">
                <div>
                    <p class="eyebrow">WELCOME BACK</p>
                    <h2 id="login-title">访问邮箱</h2>
                </div>
                <button class="icon-button" id="theme-toggle" type="button" aria-label="主题：跟随系统" title="切换主题">
                    <svg class="icon"><use href="#icon-theme"></use></svg>
                </button>
            </div>

            <form id="login-form" novalidate>
                <div class="field-group">
                    <label for="mailbox-address">邮箱地址</label>
                    <div class="input-shell">
                        <svg class="icon" aria-hidden="true"><use href="#icon-mail"></use></svg>
                        <input id="mailbox-address" name="address" type="email" inputmode="email" autocomplete="email" spellcheck="false" placeholder="name@example.com" required aria-describedby="address-error">
                    </div>
                    <p class="field-error" id="address-error" role="alert"></p>
                </div>

                <div class="field-group">
                    <label for="mailbox-key">邮箱密钥</label>
                    <div class="input-shell">
                        <svg class="icon" aria-hidden="true"><use href="#icon-key"></use></svg>
                        <input id="mailbox-key" name="mailbox_key" type="password" autocomplete="off" minlength="6" maxlength="128" pattern="[A-Za-z0-9._~\-]{6,128}" title="仅支持字母、数字及 . _ ~ -，长度 6–128" placeholder="输入邮箱密钥" required aria-describedby="key-error">
                        <button class="password-toggle" id="password-toggle" type="button" aria-label="显示密钥" aria-pressed="false">
                            <svg class="icon"><use id="password-icon" href="#icon-eye"></use></svg>
                        </button>
                    </div>
                    <p class="field-error" id="key-error" role="alert"></p>
                </div>

                <button class="primary-button" id="login-button" type="submit">
                    <span>进入收件箱</span>
                    <svg class="icon" aria-hidden="true"><use href="#icon-arrow"></use></svg>
                </button>
            </form>

            <p class="keyboard-tip">按 <kbd>Ctrl</kbd> / <kbd>⌘</kbd> + <kbd>Enter</kbd> 快速进入</p>
        </section>
    </main>

    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script src="{{ url_for('static', filename='scripts/mailbox_login.js') }}"></script>
</body>
</html>
