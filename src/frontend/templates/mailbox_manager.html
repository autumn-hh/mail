<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="referrer" content="no-referrer">
    <title>收件箱 · Maildrop</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232F746D'/%3E%3Cpath d='M7 10h18v12H7zM8 11l8 6 8-6' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/mailbox_manager.css') }}">
</head>
<body>
    <!-- 内联符号仅使用线性描边，避免从第三方 CDN 加载字体或图标。 -->
    <svg class="icon-sprite" aria-hidden="true">
        <symbol id="icon-mail" viewBox="0 0 24 24"><path d="M3 6.75h18v10.5H3zM4 7.5l8 6 8-6"></path></symbol>
        <symbol id="icon-inbox" viewBox="0 0 24 24"><path d="M4 4h16l2 10v6H2v-6zM2 14h6l2 3h4l2-3h6"></path></symbol>
        <symbol id="icon-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6m0-10h.01"></path></symbol>
        <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M18.5 9A7 7 0 0 0 6 7l-2 5m16 0-2 5a7 7 0 0 1-12.5-2"></path></symbol>
        <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 21 21"></path></symbol>
        <symbol id="icon-check" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"></path></symbol>
        <symbol id="icon-check-all" viewBox="0 0 24 24"><path d="M2 12l4 4 7-8m-3 4 4 4 8-9"></path></symbol>
        <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"></path></symbol>
        <symbol id="icon-back" viewBox="0 0 24 24"><path d="M19 12H5m5-5-5 5 5 5"></path></symbol>
        <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"></rect><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path></symbol>
        <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></symbol>
        <symbol id="icon-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></symbol>
        <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"></path><circle cx="12" cy="12" r="2.5"></circle></symbol>
        <symbol id="icon-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle></symbol>
        <symbol id="icon-swap" viewBox="0 0 24 24"><path d="M7 7h13m-3-3 3 3-3 3M17 17H4m3 3-3-3 3-3"></path></symbol>
        <symbol id="icon-close" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"></path></symbol>
        <symbol id="icon-theme" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"></path></symbol>
        <symbol id="icon-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.6-2.8 8.1-7 10-4.2-1.9-7-5.4-7-10V6z"></path><path d="M9 12l2 2 4-4"></path></symbol>
        <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"></path></symbol>
    </svg>

    <main class="auth-state" id="auth-state" aria-live="polite">
        <section class="auth-card">
            <div class="auth-icon" aria-hidden="true">
                <svg class="icon"><use href="#icon-mail"></use></svg>
            </div>
            <div class="spinner" id="auth-spinner" aria-hidden="true"></div>
            <p class="eyebrow">SECURE ACCESS</p>
            <h1 id="auth-title">正在验证邮箱</h1>
            <p id="auth-message">正在使用当前访问地址重新认证，请稍候。</p>
            <div class="auth-actions" id="auth-actions" hidden>
                <button class="button button-primary" id="retry-auth" type="button">重新验证</button>
                <a class="button" href="/">返回登录</a>
            </div>
        </section>
    </main>

    <div class="app-shell" id="mailbox-app" hidden>
        <header class="topbar">
            <a class="brand" href="/" aria-label="Maildrop 登录首页">
                <span class="brand-icon"><svg class="icon"><use href="#icon-mail"></use></svg></span>
                <span>Maildrop</span>
            </a>

            <div class="address-block">
                <span class="status-dot" id="status-dot" aria-hidden="true"></span>
                <div>
                    <p class="address-label">当前邮箱</p>
                    <h1 id="mailbox-address">—</h1>
                </div>
            </div>

            <div class="topbar-actions">
                <button class="icon-button" id="copy-address" type="button" aria-label="复制邮箱地址" title="复制邮箱地址">
                    <svg class="icon"><use href="#icon-copy"></use></svg>
                </button>
                <button class="icon-button" id="refresh-button" type="button" aria-label="刷新邮件" title="刷新邮件">
                    <svg class="icon"><use href="#icon-refresh"></use></svg>
                </button>
                <button class="icon-button" id="theme-toggle" type="button" aria-label="主题：跟随系统" title="切换主题">
                    <svg class="icon"><use href="#icon-theme"></use></svg>
                </button>
            </div>
        </header>

        <div class="workspace">
            <aside class="sidebar" aria-label="邮箱导航">
                <nav class="view-nav">
                    <button class="nav-button is-active" type="button" data-view="inbox" aria-current="page">
                        <svg class="icon"><use href="#icon-inbox"></use></svg>
                        <span>收件箱</span>
                        <span class="count-badge" id="unread-badge">0</span>
                    </button>
                    <button class="nav-button" type="button" data-view="info">
                        <svg class="icon"><use href="#icon-info"></use></svg>
                        <span>邮箱信息</span>
                    </button>
                </nav>

                <details class="switch-panel" id="switch-panel">
                    <summary>
                        <svg class="icon"><use href="#icon-swap"></use></svg>
                        <span>快速切换邮箱</span>
                    </summary>
                    <form id="switch-form">
                        <label for="switch-address">邮箱地址</label>
                        <input id="switch-address" type="email" inputmode="email" autocomplete="email" spellcheck="false" required placeholder="name@example.com">
                        <label for="switch-key">邮箱密钥</label>
                        <input id="switch-key" type="password" autocomplete="off" minlength="6" maxlength="128" pattern="[A-Za-z0-9._~\-]{6,128}" title="仅支持字母、数字及 . _ ~ -，长度 6–128" required placeholder="输入密钥">
                        <button class="button button-primary" type="submit">
                            <span>切换</span><svg class="icon"><use href="#icon-arrow"></use></svg>
                        </button>
                    </form>
                </details>

                <div class="sidebar-note">
                    <svg class="icon"><use href="#icon-shield"></use></svg>
                    <span>仅收信模式</span>
                </div>
            </aside>

            <main class="content">
                <section class="view is-active" id="inbox-view" aria-labelledby="inbox-title">
                    <div class="view-heading">
                        <div>
                            <p class="eyebrow">INBOX</p>
                            <h2 id="inbox-title">收件箱</h2>
                            <p class="view-subtitle" id="inbox-summary">正在加载邮件…</p>
                        </div>
                        <div class="heading-actions">
                            <button class="button" id="mark-all-read" type="button">
                                <svg class="icon"><use href="#icon-check-all"></use></svg><span>全部已读</span>
                            </button>
                            <button class="button button-danger" id="delete-selected" type="button" disabled>
                                <svg class="icon"><use href="#icon-trash"></use></svg><span>删除选中</span>
                            </button>
                        </div>
                    </div>

                    <div class="mail-card">
                        <div class="mail-toolbar">
                            <label class="select-all" title="选择当前列表中的全部邮件">
                                <input id="select-all" type="checkbox">
                                <span>全选</span>
                            </label>
                            <div class="search-box">
                                <svg class="icon" aria-hidden="true"><use href="#icon-search"></use></svg>
                                <label class="sr-only" for="email-search">搜索邮件</label>
                                <input id="email-search" type="search" autocomplete="off" placeholder="搜索主题、发件人或正文">
                                <button class="clear-search" id="clear-search" type="button" aria-label="清除搜索" hidden>
                                    <svg class="icon"><use href="#icon-close"></use></svg>
                                </button>
                            </div>
                        </div>
                        <div class="email-list" id="email-list" aria-live="polite" aria-busy="true"></div>
                    </div>
                </section>

                <section class="view" id="detail-view" aria-labelledby="detail-subject" hidden>
                    <div class="detail-heading">
                        <button class="button" id="detail-back" type="button">
                            <svg class="icon"><use href="#icon-back"></use></svg><span>返回收件箱</span>
                        </button>
                        <div class="heading-actions">
                            <button class="button" id="toggle-read" type="button">
                                <svg class="icon"><use href="#icon-eye"></use></svg><span>标记未读</span>
                            </button>
                            <button class="button button-danger" id="delete-current" type="button">
                                <svg class="icon"><use href="#icon-trash"></use></svg><span>删除</span>
                            </button>
                        </div>
                    </div>
                    <article class="detail-card">
                        <header class="message-header">
                            <p class="message-status" id="detail-status">邮件详情</p>
                            <h2 id="detail-subject">—</h2>
                            <dl class="message-meta">
                                <div><dt>发件人</dt><dd id="detail-from">—</dd></div>
                                <div><dt>收件人</dt><dd id="detail-to">—</dd></div>
                                <div><dt>时间</dt><dd id="detail-date">—</dd></div>
                            </dl>
                        </header>
                        <div class="message-body" id="detail-body"></div>
                    </article>
                </section>

                <section class="view" id="info-view" aria-labelledby="info-title" hidden>
                    <div class="view-heading">
                        <div>
                            <p class="eyebrow">MAILBOX INFO</p>
                            <h2 id="info-title">邮箱信息</h2>
                            <p class="view-subtitle">访问状态与邮件概览</p>
                        </div>
                    </div>
                    <div class="info-grid">
                        <article class="info-card info-card-wide">
                            <span class="info-icon"><svg class="icon"><use href="#icon-mail"></use></svg></span>
                            <p>邮箱地址</p>
                            <strong id="info-address">—</strong>
                            <button class="text-button" id="copy-address-secondary" type="button">复制地址</button>
                        </article>
                        <article class="info-card">
                            <span class="info-icon"><svg class="icon"><use href="#icon-list"></use></svg></span>
                            <p>邮件总数</p>
                            <strong id="info-total">0</strong>
                        </article>
                        <article class="info-card">
                            <span class="info-icon"><svg class="icon"><use href="#icon-dot"></use></svg></span>
                            <p>未读邮件</p>
                            <strong id="info-unread">0</strong>
                        </article>
                        <article class="info-card">
                            <span class="info-icon"><svg class="icon"><use href="#icon-clock"></use></svg></span>
                            <p>创建时间</p>
                            <strong id="info-created">—</strong>
                        </article>
                        <article class="info-card">
                            <span class="info-icon"><svg class="icon"><use href="#icon-clock"></use></svg></span>
                            <p>到期时间</p>
                            <strong id="info-expires">—</strong>
                        </article>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script src="{{ url_for('static', filename='scripts/mailbox_manager.js') }}"></script>
</body>
</html>
