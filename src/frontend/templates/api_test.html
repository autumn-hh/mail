<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>只读 API 调试台 - Maildrop</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/api_test.css') }}">
</head>
<body>
    <main class="debug-shell">
        <header class="topbar">
            <div>
                <p class="eyebrow">Maildrop</p>
                <h1>只读 API 调试台</h1>
                <p class="intro">用邮箱地址和密钥完成鉴权，仅查询邮箱信息与收件箱。</p>
            </div>
            <nav class="top-actions" aria-label="页面导航">
                <a class="button button-secondary" href="/">公开入口</a>
                <a class="button button-secondary" href="/admin">管理后台</a>
            </nav>
        </header>

        <section class="panel" aria-labelledby="auth-title">
            <div class="panel-heading">
                <div>
                    <p class="step-label">步骤 1</p>
                    <h2 id="auth-title">邮箱鉴权</h2>
                </div>
                <p class="panel-hint">密钥与访问令牌只保存在当前页面内存，刷新后自动清除。</p>
            </div>

            <form id="auth-form" autocomplete="off" novalidate>
                <div class="form-grid">
                    <label class="field" for="mailbox-address">
                        <span>邮箱地址</span>
                        <input
                            id="mailbox-address"
                            name="address"
                            type="email"
                            autocomplete="off"
                            placeholder="user@example.com"
                            required
                        >
                    </label>
                    <label class="field" for="mailbox-key">
                        <span>邮箱密钥</span>
                        <input
                            id="mailbox-key"
                            name="mailbox_key"
                            type="password"
                            autocomplete="off"
                            placeholder="输入 mailbox_key"
                            spellcheck="false"
                            required
                        >
                    </label>
                </div>

                <div class="button-row">
                    <button id="auth-button" class="button button-primary" type="submit">获取访问令牌</button>
                    <button id="clear-session-button" class="button button-secondary" type="button">清空会话</button>
                </div>
                <p id="auth-status" class="status" data-kind="idle" role="status" aria-live="polite">尚未鉴权</p>
            </form>
        </section>

        <section class="panel" aria-labelledby="request-title">
            <div class="panel-heading">
                <div>
                    <p class="step-label">步骤 2</p>
                    <h2 id="request-title">只读请求</h2>
                </div>
                <p class="panel-hint">请求自动附带当前内存中的 Bearer 令牌。</p>
            </div>

            <div class="button-row">
                <button id="mailbox-info-button" class="button button-primary" type="button" disabled>查询邮箱信息</button>
                <button id="inbox-button" class="button button-primary" type="button" disabled>查询收件箱</button>
            </div>
        </section>

        <section class="panel console-panel" aria-labelledby="output-title">
            <div class="console-heading">
                <div>
                    <p class="step-label">响应</p>
                    <h2 id="output-title">JSON 输出</h2>
                </div>
                <button id="clear-output-button" class="button button-quiet" type="button">清空输出</button>
            </div>
            <pre id="api-output" tabindex="0" aria-live="polite">等待请求...</pre>
        </section>
    </main>

    <script src="{{ url_for('static', filename='scripts/api_test.js') }}"></script>
</body>
</html>
